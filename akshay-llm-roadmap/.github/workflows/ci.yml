name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f akshay-llm-roadmap/requirements.txt ]; then
            pip install -r akshay-llm-roadmap/requirements.txt
          else
            pip install pytest flake8
          fi
      - name: Run flake8
        run: flake8 . || true
      - name: Run tests
        run: pytest -q || true

# Note: This CI is minimal. For GPU tests and experiment runs, use self-hosted runners with GPUs and set WANDB_API_KEY as a secret.